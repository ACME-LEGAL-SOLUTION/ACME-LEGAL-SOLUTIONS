name: Deploy public site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish public static experience
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare public site artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R styles _site/styles
          cp -R scripts _site/scripts
          printf '%s\n' 'This file disables Jekyll processing for the static ACME site.' > _site/.nojekyll

      - name: Verify public artifact contains no server-side application files
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/styles/00-reset.css
          test -f _site/scripts/main.js
          ! find _site -type f \( -name '*.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .
          ! find _site -type f -path '*/api/*' -print -quit | grep -q .

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
