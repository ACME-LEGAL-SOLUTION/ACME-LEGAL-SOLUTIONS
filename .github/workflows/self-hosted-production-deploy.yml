name: Self-Hosted Production Deploy

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Exact Git branch, tag, or commit to deploy'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: acme-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ACME API to approved self-host
    runs-on: [self-hosted, windows, acme-production]
    environment: production
    timeout-minutes: 30

    steps:
      - name: Configure Git checkout policy
        shell: cmd
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout requested release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 1

      - name: Normalize Git checkout for canonical checksums
        shell: cmd
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - name: Verify release SHA
        shell: cmd
        run: |
          for /f "delims=" %%S in ('git rev-parse HEAD') do set "SHA=%%S"
          echo Deploying release SHA: %SHA%
          node -e "const s=process.argv[1]; if(!/^[0-9a-f]{40}$/.test(s)){console.error('Invalid release SHA: '+s);process.exit(1)}" "%SHA%"

      - name: Deploy and validate
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\deploy\self-host-deploy.ps1 -Action Deploy -AppRoot "%GITHUB_WORKSPACE%"
