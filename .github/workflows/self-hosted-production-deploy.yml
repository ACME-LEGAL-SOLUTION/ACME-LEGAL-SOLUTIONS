name: Self-Hosted Production Deploy

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Exact Git branch, tag, or commit to deploy'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: acme-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ACME API to approved self-host
    runs-on: [self-hosted, windows, acme-production]
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout requested release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 1

      - name: Normalize and verify canonical SQL checkout
        shell: powershell
        run: |
          git reset --hard HEAD
          $sqlFiles = @(git ls-files '*.sql')
          if ($sqlFiles.Count -eq 0) { throw 'No tracked SQL sources found' }
          $crlfFiles = @()
          foreach ($relativePath in $sqlFiles) {
            $fullPath = Join-Path $env:GITHUB_WORKSPACE $relativePath
            $bytes = [System.IO.File]::ReadAllBytes($fullPath)
            for ($i = 0; $i -lt ($bytes.Length - 1); $i++) {
              if ($bytes[$i] -eq 13 -and $bytes[$i + 1] -eq 10) {
                $crlfFiles += $relativePath
                break
              }
            }
          }
          if ($crlfFiles.Count -gt 0) {
            Write-Error ('SQL checkout contains CRLF line endings: ' + ($crlfFiles -join ', '))
            exit 1
          }
          git ls-files --eol '*.sql'

      - name: Verify release SHA
        shell: cmd
        run: |
          for /f "delims=" %%S in ('git rev-parse HEAD') do set "SHA=%%S"
          echo Deploying release SHA: %SHA%
          node -e "const s=process.argv[1]; if(!/^[0-9a-f]{40}$/.test(s)){console.error('Invalid release SHA: '+s);process.exit(1)}" "%SHA%"

      - name: Deploy and validate
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\deploy\self-host-deploy.ps1 -Action Deploy -AppRoot "%GITHUB_WORKSPACE%"