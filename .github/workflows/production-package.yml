name: Production Package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  container:
    name: Build production container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --pull --tag acme-legal-solutions:${{ github.sha }} .
      - name: Inspect image configuration
        run: |
          test "$(docker image inspect acme-legal-solutions:${{ github.sha }} --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect acme-legal-solutions:${{ github.sha }} --format '{{.Config.ExposedPorts}}')" = "map[3000/tcp:{}]"
          test "$(docker image inspect acme-legal-solutions:${{ github.sha }} --format '{{.Config.Healthcheck.Test}}')" != "[]"
      - name: Verify no obvious secret files in image
        run: |
          ! docker run --rm --entrypoint /bin/sh acme-legal-solutions:${{ github.sha }} -c 'find /app -type f \( -name "*.pem" -o -name "*.key" -o -name ".env" -o -name ".env.*" \) -print -quit | grep -q .'
