name: ACME Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test

  real-sql:
    name: Real ${{ matrix.provider }} migration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: postgresql
            image: postgres:16
            host_port: 5432
            container_port: 5432
            url: postgresql://postgres:acme@127.0.0.1:5432/acme
          - provider: mysql
            image: mysql:8.4
            host_port: 3306
            container_port: 3306
            url: mysql://root:acme@127.0.0.1:3306/acme
          - provider: mariadb
            image: mariadb:11
            host_port: 3307
            container_port: 3306
            url: mariadb://root:acme@127.0.0.1:3307/acme
    services:
      db:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: acme
          POSTGRES_DB: acme
          MYSQL_ROOT_PASSWORD: acme
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: acme
          MARIADB_ROOT_PASSWORD: acme
          MARIADB_ROOT_HOST: "%"
          MARIADB_DATABASE: acme
        ports:
          - ${{ matrix.host_port }}:${{ matrix.container_port }}
        options: >-
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run real engine integration
        env:
          ACME_ENV: production
          ACME_REAL_DB_PROVIDER: ${{ matrix.provider }}
          ACME_REAL_DB_ALLOW_MUTATION: "true"
          ACME_REAL_DB_CLIENT_MODULE: ./api/persistence/ci-real-db-clients.js
          ACME_REAL_DB_URL: ${{ matrix.url }}
        run: npm run test:integration

  real-sqlite:
    name: Real sqlite migration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run real engine integration
        env:
          ACME_ENV: production
          ACME_REAL_DB_PROVIDER: sqlite
          ACME_REAL_DB_ALLOW_MUTATION: "true"
          ACME_REAL_DB_CLIENT_MODULE: ./api/persistence/ci-real-db-clients-v2.js
          ACME_REAL_DB_URL: file:///tmp/acme-ci.sqlite
        run: npm run test:integration
